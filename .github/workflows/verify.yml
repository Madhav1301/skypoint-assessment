# Fresh-machine verification of the assessor flow: clone, place the data
# pack, one command, exit 0, outputs present, batch_004 rejected-not-fatal,
# tests in container.
#
# The data pack is confidential and not committed to this public repository,
# so on a plain checkout every verification step no-ops with a notice. The
# full flow runs wherever the pack is present at data/candidate_pack (it is
# exercised locally before submission; see README).
name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for the confidential data pack
        id: pack
        run: |
          if [ -d data/candidate_pack/landing ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Data pack not present (confidential, excluded from the public repo). Verification steps skipped; run locally with the pack at data/candidate_pack."
          fi

      - name: Prepare environment file
        if: steps.pack.outputs.present == 'true'
        run: cp .env.example .env

      - name: One-command run (docker compose up --build)
        if: steps.pack.outputs.present == 'true'
        run: docker compose up --build --exit-code-from pipeline pipeline

      - name: Outputs written to ./output
        if: steps.pack.outputs.present == 'true'
        run: |
          ls -l output
          test -f output/chronic_acute_encounters.csv
          test -f output/batch_audit.csv
          test -f output/quarantine.csv
          test -f output/fact_encounter_versions.csv
          test -f output/dq_report_batch_004.md

      - name: Rejected batch is reported, not fatal
        if: steps.pack.outputs.present == 'true'
        run: |
          grep -q 'batch_004' output/batch_audit.csv
          grep -q 'MANIFEST_VALIDATION_FAILED' output/batch_audit.csv
          grep -q 'REJECTED' output/dq_report_batch_004.md

      - name: Test suite in container (docker compose run --rm tests)
        if: steps.pack.outputs.present == 'true'
        run: docker compose run --rm tests

      - name: Upload generated outputs
        if: steps.pack.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            output/*.csv
            output/*.md
          retention-days: 14

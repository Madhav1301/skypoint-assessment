# Facility name resolution: per source system, canonical facility_id -> the
# normalised name variants observed in that system's feeds.
#
# Normalisation applied before lookup (same in code and in this file):
#   uppercase, strip the punctuation . , ' -, collapse runs of whitespace.
# Resolution is deliberately an exact lookup on the normalised name: with only
# 8 facilities a curated alias table is deterministic and auditable, where
# fuzzy matching could silently mis-assign a hospital. Unresolved names are
# quarantined (reason UNRESOLVED_FACILITY) and surface in the DQ report; a
# genuinely new variant is added here, as config, after review.
#
# Known-bad values intentionally NOT aliased (they must quarantine):
#   "TEST FACILITY - DO NOT USE" (EPIC_NORTH), "Westfield Surgical Center"
#   (ATHENA_CLINICS - not part of the 8-facility master).


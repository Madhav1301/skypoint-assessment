# Schema contracts: the exact file header (names AND order) each source system
# is allowed to deliver. A file must match one configured version exactly;
# anything else stops the batch with a clear error. Expected schema changes are
# absorbed by adding a new version HERE — never by editing pipeline code.
#
#   rename:  source column -> canonical column
#   extras:  source columns with no canonical equivalent; preserved verbatim in
#            raw.encounters.extras_json for lineage, not modeled downstream.

contracts:
  EPIC_NORTH:
    - version: v1
      columns: &canonical_columns
        - source_system
        - source_record_id
        - facility_name
        - patient_mrn
        - patient_first_name
        - patient_last_name
        - patient_dob
        - patient_sex
        - patient_zip
        - patient_phone
        - admit_date
        - discharge_date
        - encounter_type
        - attending_npi
        - attending_provider_name
        - primary_dx_code
        - chief_complaint
        - payer_name
        - billed_amount
        - claim_status
        - last_updated_ts

  LEGACY_MEDITECH:
    - version: v1
      columns: *canonical_columns

  ATHENA_CLINICS:
    - version: v1
      columns: *canonical_columns
    # Delivered from batch_003 onward: columns renamed and reordered,
    # encounter_source added, file gains a UTF-8 BOM.
    - version: v2
      columns:
        - source_system
        - source_record_id
        - facility_name
        - encounter_source
        - admit_date
        - discharge_date
        - encounter_type
        - patient_mrn
        - patient_last_name
        - patient_first_name
        - patient_dob
        - patient_sex
        - patient_zip
        - patient_phone
        - attending_provider_npi
        - attending_provider_name
        - primary_dx_code
        - chief_complaint
        - payer_name
        - total_charge
        - claim_status
        - last_updated_ts
      rename:
        attending_provider_npi: attending_npi
        total_charge: billed_amount
      extras:
        - encounter_source
